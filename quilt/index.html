<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometric Quilt Pattern - Stars & Hearts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="quilt-container">
    <!-- Row 1 -->
    <div class="quilt-item pink-gradient-1 span-2"></div>
    <div class="quilt-item pink-solid-1"></div>
    <div class="quilt-item star-patch">★</div>
    <div class="quilt-item pink-gradient-2"></div>
    <div class="quilt-item pink-solid-2"></div>

    <!-- Row 2 -->
    <div class="quilt-item pink-solid-2"></div>
    <div class="quilt-item heart-patch span-2" style="grid-row: span 2;">♥</div>
    <div class="quilt-item pink-gradient-3"></div>
    <div class="quilt-item purple-solid"></div>
    <div class="quilt-item pink-gradient-1"></div>

    <!-- Row 3 -->
    <div class="quilt-item pink-gradient-2"></div>
    <div class="quilt-item pink-solid-1"></div>
    <div class="quilt-item star-patch span-2">★</div>
    <div class="quilt-item pink-gradient-3"></div>

    <!-- Row 4 -->
    <div class="quilt-item purple-solid span-2"></div>
    <div class="quilt-item heart-patch">♥</div>
    <div class="quilt-item pink-gradient-1"></div>
    <div class="quilt-item pink-solid-2"></div>
    <div class="quilt-item star-patch">★</div>
  </div>
</body>
</html>

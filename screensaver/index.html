<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dual Square Screensaver</title>
  <style>
    /* Dark Canvas */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090910;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      cursor: pointer;
    }

    /* Helper Instruction */
    .hint {
      position: absolute;
      bottom: 30px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    body:hover .hint { opacity: 0; }

    /* Screensaver Container & Centered Base Squares */
    .screensaver { position: relative; width: 220px; height: 220px; }
    .screensaver div {
      position: absolute;
      inset: 0;
      margin: auto;
      opacity: 0.35;
      filter: drop-shadow(0 0 15px currentColor);
      transition: transform 0.6s ease, opacity 0.6s ease, filter 0.6s ease;
    }

    /* Square 1: Neon Purple Outline Square */
    .screensaver div:nth-child(1) {
      width: 180px;
      height: 180px;
      border: 4px solid #ff8ee1;
      border-radius: 20px;
      color: #ff8ee1;
      transform: rotate(15deg);
    }

    /* Square 2: Solid Magenta Accent Square */
    .screensaver div:nth-child(2) {
      width: 110px;
      height: 110px;
      background: #ff007f;
      border-radius: 16px;
      color: #ff007f;
      transform: rotate(-20deg);
    }

    /* :hover - Fade in & Trigger Continuous Animations */
    body:hover .screensaver div { opacity: 0.9; }
    body:hover .screensaver div:nth-child(1) { animation: rotatePulse 6s ease-in-out infinite alternate; }
    body:hover .screensaver div:nth-child(2) { animation: floatSpin 4s ease-in-out infinite alternate; }

    /* :active - Speed up on click */
    body:active .screensaver div { animation-duration: 1.2s !important; filter: brightness(1.4) drop-shadow(0 0 25px currentColor); }

    /* Concise Keyframes */
    @keyframes rotatePulse {
      0%   { transform: rotate(15deg) translate(0, 0) scale(0.9); }
      100% { transform: rotate(195deg) translate(-30px, 20px) scale(1.15); }
    }

    @keyframes floatSpin {
      0%   { transform: rotate(-20deg) translate(0, 0) scale(1); }
      100% { transform: rotate(160deg) translate(40px, -30px) scale(1.25); }
    }
  </style>
</head>
<body>

  <div class="screensaver">
    <div></div>
    <div></div>
  </div>

  <div class="hint">Hover to start screensaver</div>

</body>
</html>
